<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Scrum</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Nunito+Sans:wght@400;600;700&display=swap">
<style>
/* Layout: app de duas áreas (aluno / profissional), conteúdo central de até 960px, navegação fixa na base. */
:root{
  --bg:#FBF3F2; --surface:#FFFFFF; --surface2:#F5E4E2; --ink:#2B1412; --muted:#7A5753; --line:#EAD3D0; --stripe:#E8CFCB;
  --brand:#B91C1C; --on-brand:#FFFFFF; --brand-soft:#FBDEDA; --brand-hi:#EF5350; --warm:#6E1414;
  --ok:#2B7A3D; --ok-soft:#DDF1E1; --warn:#8A5A00; --warn-soft:#FBEBC8; --bad:#A31515; --bad-soft:#F9D2CE;
  --font-display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --font-body:"Nunito Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1B1010; --surface:#271817; --surface2:#331F1E; --ink:#F7E8E6; --muted:#CFA9A4; --line:#46292A; --stripe:#3A2423;
  --brand:#F26B62; --on-brand:#2B0807; --brand-soft:#42201F; --brand-hi:#FF8A80; --warm:#FFB4A9;
  --ok:#6CCB82; --ok-soft:#173424; --warn:#E9B64F; --warn-soft:#3A2D10; --bad:#FF9A8E; --bad-soft:#4A1C19; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1B1010; --surface:#271817; --surface2:#331F1E; --ink:#F7E8E6; --muted:#CFA9A4; --line:#46292A; --stripe:#3A2423;
  --brand:#F26B62; --on-brand:#2B0807; --brand-soft:#42201F; --brand-hi:#FF8A80; --warm:#FFB4A9;
  --ok:#6CCB82; --ok-soft:#173424; --warn:#E9B64F; --warn-soft:#3A2D10; --bad:#FF9A8E; --bad-soft:#4A1C19; color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--font-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 104px}
.wrap{max-width:960px;margin:0 auto}
h1,h2,h3{font-family:var(--font-display);line-height:1.15;margin:0;text-wrap:balance}
h1{font-size:1.7rem} h2{font-size:1.25rem} h3{font-size:1.05rem}
p{margin:0}
.muted{color:var(--muted)} .small{font-size:.875rem}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:14px 0 6px}
.brand{font-family:var(--font-display);font-weight:700;font-size:1.3rem;display:flex;align-items:center;gap:8px}
.brand svg{width:35px;height:40px;flex:none}
.hero{display:flex;align-items:center;gap:18px}
.hero .logo{flex:none;height:112px;width:auto}
@media (max-width:480px){.hero .logo{height:92px}}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--surface2);border-radius:999px;padding:3px}
.seg button{border:0;background:none;color:var(--muted);font:600 .875rem var(--font-body);padding:7px 14px;border-radius:999px;cursor:pointer;min-height:36px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.15)}
.banner{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:10px 14px;margin:8px 0;font-size:.9rem}
.banner.bad{background:var(--bad-soft);color:var(--bad)}
main{display:flex;flex-direction:column;gap:16px;padding-top:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px}
.card.flat{background:transparent;border-style:dashed}
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;min-width:0}
.tile .n{font:700 2rem/1 var(--font-display);font-variant-numeric:tabular-nums}
.tile .l{color:var(--muted);font-size:.85rem;margin-top:6px}
.tile.hot .n{color:var(--warm)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);
  font:700 .95rem var(--font-body);padding:11px 18px;border-radius:12px;cursor:pointer;min-height:46px}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{min-height:36px;padding:6px 12px;font-size:.85rem}
.btn:focus-visible,.seg button:focus-visible,nav button:focus-visible,.row:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.actions{display:flex;gap:10px;flex-wrap:wrap}
form{display:flex;flex-direction:column;gap:16px}
label,.lab{font-weight:700;font-size:.92rem;display:block;margin-bottom:6px}
.hint{font-weight:400;color:var(--muted);font-size:.85rem}
input[type=text],input[type=tel],input[type=date],input[type=number],select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);
  border:1px solid var(--line);border-radius:10px;padding:11px 12px;min-height:46px}
textarea{min-height:88px;resize:vertical}
.two{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.faces{display:flex;gap:8px;flex-wrap:wrap}
.faces input,.pick input,.chip input{position:absolute;opacity:0;pointer-events:none}
.faces label{margin:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:64px;padding:8px 6px;border:2px solid var(--line);border-radius:12px;font-weight:600;font-size:.78rem;color:var(--muted);background:var(--bg)}
.faces svg{width:38px;height:38px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
.faces input:checked+label{border-color:var(--brand);color:var(--brand);background:var(--brand-soft)}
.faces input:focus-visible+label,.pick input:focus-visible+label,.chip input:focus-visible+label{outline:3px solid var(--brand);outline-offset:2px}
.pick{display:flex;gap:8px;flex-wrap:wrap}
.pick label{margin:0;cursor:pointer;min-width:56px;text-align:center;padding:10px 14px;border:2px solid var(--line);border-radius:12px;font-weight:700;background:var(--bg)}
.pick input:checked+label{border-color:var(--brand);background:var(--brand-soft);color:var(--brand)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip label{margin:0;cursor:pointer;padding:8px 14px;border:1px solid var(--line);border-radius:999px;font-weight:600;font-size:.9rem;background:var(--bg)}
.chip input:checked+label{background:var(--brand);color:var(--on-brand);border-color:var(--brand)}
input[type=range]{width:100%;accent-color:var(--brand);min-height:36px}
.range-out{font:700 1.6rem var(--font-display);color:var(--brand);min-width:2ch;text-align:right}
.rangebox{display:flex;align-items:center;gap:14px}
.check{display:flex;gap:10px;align-items:flex-start;font-weight:400}
.check input{width:22px;height:22px;margin-top:2px;flex:none;accent-color:var(--brand)}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:.78rem;font-weight:700;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.n{background:var(--surface2);color:var(--muted)}
.list{display:flex;flex-direction:column;gap:8px}
.row{display:flex;gap:12px;align-items:center;justify-content:space-between;width:100%;text-align:left;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font:inherit;cursor:pointer;min-height:56px}
.row.static{cursor:default}
.row .who{min-width:0;display:flex;flex-direction:column}
.row .who b{overflow-wrap:anywhere}
.row .tags{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.sev{border-left:6px solid var(--line)} .sev.bad{border-left-color:var(--bad)} .sev.warn{border-left-color:var(--warn)} .sev.ok{border-left-color:var(--ok)}
.charts{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font:11px var(--font-body)}
.chart .g{stroke:var(--line);stroke-width:1}
.chart .ln{fill:none;stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.chart .dot{stroke:var(--surface);stroke-width:2}
.chart .refl{stroke:var(--bad);stroke-dasharray:4 4;stroke-width:1.2}
.ach{display:flex;gap:8px;flex-wrap:wrap}
.ach span{border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:.85rem;font-weight:600;color:var(--muted)}
.ach span.on{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.78rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
td.num{font-variant-numeric:tabular-nums}
.scroll{overflow-x:auto}
nav.bar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);z-index:20;
  padding:6px max(10px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px))}
nav.bar .in{max-width:960px;margin:0 auto;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px}
nav.bar button{border:0;background:none;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;font:700 .72rem var(--font-body);padding:6px 2px;border-radius:10px;min-height:52px;cursor:pointer}
nav.bar button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
nav.bar button[aria-current="page"]{color:var(--brand);background:var(--brand-soft)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(88px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;z-index:30;max-width:calc(100% - 32px)}
.big{font:700 2.2rem/1 var(--font-display)}
.landing{display:flex;flex-direction:column;align-items:center;text-align:center;gap:20px;padding:8px 0 24px}
.landing .logo{height:190px;width:auto}
.choices{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));width:100%;max-width:680px}
.choice{text-align:left;display:flex;flex-direction:column;gap:6px;min-height:130px;padding:20px;background:var(--surface);color:var(--ink);border:2px solid var(--line);border-radius:16px;font:inherit;cursor:pointer}
.choice b{font:700 1.35rem var(--font-display);color:var(--brand)}
.choice span{color:var(--muted);font-size:.95rem}
.choice:hover{border-color:var(--brand);background:var(--brand-soft)}
.choice:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
#splash{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;align-items:center;justify-content:center;transition:opacity .45s ease}
#splash.out{opacity:0;pointer-events:none}
#splash svg{width:min(62vw,280px);height:auto;overflow:visible;animation:spulse .6s 1.85s ease-in-out}
#splash .st line{stroke:var(--stripe);stroke-width:3;transform-box:fill-box;transform-origin:left center;animation:sline .5s ease-out both}
#splash .run{animation:srun .85s .5s cubic-bezier(.2,.8,.2,1) both}
#splash .wm{animation:sword .6s 1.2s ease-out both}
@keyframes sline{from{transform:scaleX(0);opacity:0}to{transform:none;opacity:1}}
@keyframes srun{from{opacity:0;transform:translateX(-80px)}to{opacity:1;transform:none}}
@keyframes sword{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
@keyframes spulse{0%,100%{transform:scale(1)}40%{transform:scale(1.06)}}
.landing>*{opacity:0}
body.go .landing>*{animation:up .55s cubic-bezier(.2,.8,.2,1) both}
body.go .landing>:nth-child(1){animation-delay:.05s}
body.go .landing>:nth-child(2){animation-delay:.18s}
body.go .landing>:nth-child(3){animation-delay:.32s}
body.go .landing>:nth-child(4){animation-delay:.46s}
body.go .landing>:nth-child(5){animation-delay:.7s}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){#splash *,#splash svg{animation:none!important}.landing>*{opacity:1!important;animation:none!important}}
.help-num{font:700 2.4rem/1 var(--font-display);color:var(--brand)}
.kv{display:grid;grid-template-columns:minmax(110px,160px) 1fr;gap:6px 14px}
.kv dt{color:var(--muted);font-size:.85rem} .kv dd{margin:0;overflow-wrap:anywhere}
@media (prefers-reduced-motion:no-preference){.card,.tile{animation:in .25s ease-out}@keyframes in{from{opacity:.4;transform:translateY(4px)}}}
@media (max-width:480px){h1{font-size:1.45rem}.kv{grid-template-columns:1fr}}
</style>

<script>
(function(){
"use strict";
var $=function(s){return document.querySelector(s)};
var esc=function(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]})};
var pad=function(n){return String(n).padStart(2,"0")};
var ymd=function(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())};
var today=function(){return ymd(new Date())};
function addDays(s,n){var p=s.split("-").map(Number);return ymd(new Date(p[0],p[1]-1,p[2]+n))}
function diffDays(a,b){var A=a.split("-").map(Number),B=b.split("-").map(Number);return Math.round((Date.UTC(B[0],B[1]-1,B[2])-Date.UTC(A[0],A[1]-1,A[2]))/864e5)}
function fmt(s){var p=s.split("-");return p[2]+"/"+p[1]}
function avg(a){return a.length?a.reduce(function(x,y){return x+y},0)/a.length:null}
function f1(n){return n==null?"–":(Math.round(n*10)/10).toString().replace(".",",")}
function store(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}

var ESPORTES=["Caminhada","Corrida","Futebol","Vôlei","Basquete","Natação","Ciclismo","Musculação","Funcional","Artes marciais","Dança","Yoga"];
var PUBLICOS=["Adolescentes","Jovens adultos","Adultos","Mulheres","Idosos","Outro"];
var HUMOR=["Muito mal","Mal","Neutro","Bem","Muito bem"];

var S={db:null,dl:null,uid:null,canEdit:false,canWrite:null,ready:false,slow:false,role:null,tab:"inicio",sel:null,
  me:null,meLoaded:false,turmas:[],alunos:[],alunosLoaded:false,sample:false,filtro:"",confirmDel:null,acolhe:false,pending:false,err:null};

(function(){var sr=store("scrum-perfil");if(sr==="aluno"||sr==="pro"){S.role=sr;S.tab=sr==="pro"?"alunos":"inicio"}})();

/* ---------- dados de exemplo (nada é salvo) ---------- */
var SAMPLE=null;
function buildSample(){
  if(SAMPLE)return SAMPLE;
  var t=today();
  function mk(nome,turma,seedOff,plan){
    var ck=[],at=[],i;
    for(i=20;i>=0;i--){
      var d=addDays(t,-i);var p=plan(i);
      if(p===null)continue;
      ck.push({d:d,humor:p.h,fissura:p.f,usou:p.u,praticou:p.pr,obs:p.o||""});
      if(p.pr)at.push({id:"x"+d,d:d,esporte:ESPORTES[(i+seedOff)%6],min:30+((i*7+seedOff)%5)*10,sentiu:Math.min(5,Math.max(1,p.h)),aprov:Math.min(5,p.h+(i%2)),obs:""});
    }
    return {id:"ex-"+nome,nome:nome,nascimento:"",contato:"",historico:"Exemplo ilustrativo.",objetivos:"Criar rotina e reduzir a vontade de beber.",esportes:["Caminhada","Futebol"],
      apoioNome:"Contato de exemplo",apoioTel:"(00) 00000-0000",turmaId:turma,consentimento:true,checkins:ck,atividades:at,exemplo:true};
  }
  SAMPLE={
    turmas:[{id:"ex-t1",nome:"Turma exemplo, Adultos",publico:"Adultos"}],
    alunos:[
      mk("Aluno de exemplo 1","ex-t1",1,function(i){return{h:i>14?2:i>7?3:4,f:i>14?7:i>7?5:3,u:i===19,pr:i%2===0,o:i===0?"Dia tranquilo, joguei bola com a turma.":""}}),
      mk("Aluno de exemplo 2","ex-t1",2,function(i){return{h:i<3?1:3,f:i<3?9:5,u:i<2,pr:i>4&&i%2===1,o:i===0?"Dia muito difícil, sem vontade de sair.":""}}),
      mk("Aluno de exemplo 3","ex-t1",3,function(i){return i<5?null:{h:3+(i%2),f:4,u:false,pr:i%3===0}})
    ]};
  return SAMPLE;
}
function curMe(){return S.sample?buildSample().alunos[0]:S.me}
function curAlunos(){return S.sample?buildSample().alunos:S.alunos.filter(function(a){return a.nome})}
function curTurmas(){return S.sample?buildSample().turmas:S.turmas}
function turmaNome(id){var t=curTurmas().filter(function(x){return x.id===id})[0];return t?t.nome:"Sem turma"}

/* ---------- cálculos ---------- */
function stats(a){
  var ck=(a&&a.checkins||[]).slice().sort(function(x,y){return x.d<y.d?-1:1});
  var by={};ck.forEach(function(c){by[c.d]=c});
  var t=today(),cur=by[t]?t:addDays(t,-1),streak=0;
  while(by[cur]&&by[cur].usou===false){streak++;cur=addDays(cur,-1)}
  var best=0,run=0,prev=null;
  ck.forEach(function(c){if(c.usou===false){run=(prev&&diffDays(prev,c.d)===1)?run+1:1;best=Math.max(best,run)}else run=0;prev=c.d});
  var w=addDays(t,-6);
  var last7=ck.filter(function(c){return c.d>=w});
  var ats=(a&&a.atividades||[]).slice().sort(function(x,y){return x.d<y.d?1:-1});
  var ats7=ats.filter(function(x){return x.d>=w});
  var last=ck[ck.length-1]||null;
  var alerts=[];
  var l3=ck.slice(-3);
  if(l3.length===3&&avg(l3.map(function(c){return c.humor}))<2)alerts.push({s:"bad",t:"Humor médio abaixo de 2 nos 3 últimos registros"});
  if(l3.length===3&&l3.every(function(c){return c.fissura>=8}))alerts.push({s:"bad",t:"Fissura 8 ou mais em 3 registros seguidos"});
  if(last&&diffDays(last.d,t)>=3)alerts.push({s:"warn",t:"Sem check-in há "+diffDays(last.d,t)+" dias"});
  if(last&&last.usou===true&&diffDays(last.d,t)<=1)alerts.push({s:"warn",t:"Uso registrado no último check-in"});
  var sev=alerts.some(function(x){return x.s==="bad"})?"bad":alerts.length?"warn":(last?"ok":"n");
  return {ck:ck,by:by,streak:streak,best:best,humor7:avg(last7.map(function(c){return c.humor})),fissura7:avg(last7.map(function(c){return c.fissura})),
    ats:ats,ats7:ats7.length,last:last,alerts:alerts,sev:sev,doneToday:!!by[t]};
}
function conquistas(st,a){
  var n=(a&&a.atividades||[]).length;
  return [[3,"3 dias sem beber",st.best>=3],[7,"7 dias sem beber",st.best>=7],[30,"30 dias sem beber",st.best>=30],[90,"90 dias sem beber",st.best>=90],
    [1,"1ª atividade",n>=1],[10,"10 atividades",n>=10],[30,"30 atividades",n>=30]].map(function(x){return{l:x[1],on:x[2]}});
}

/* ---------- gráficos ---------- */
function series14(st,field){
  var t=today(),out=[],i;
  for(i=13;i>=0;i--){var d=addDays(t,-i);out.push({d:d,v:st.by[d]?st.by[d][field]:null})}
  return out;
}
function chart(ser,o){
  var W=560,H=180,L=32,R=12,T=12,B=26,n=ser.length;
  var x=function(i){return L+(W-L-R)*(i/(n-1))};
  var y=function(v){return T+(H-T-B)*(1-(v-o.min)/(o.max-o.min))};
  var g="",i,segs=[],cur=[];
  o.ticks.forEach(function(tk){g+='<line class="g" x1="'+L+'" x2="'+(W-R)+'" y1="'+y(tk)+'" y2="'+y(tk)+'"/><text x="'+(L-6)+'" y="'+(y(tk)+4)+'" text-anchor="end">'+tk+'</text>'});
  if(o.ref!=null)g+='<line class="refl" x1="'+L+'" x2="'+(W-R)+'" y1="'+y(o.ref)+'" y2="'+y(o.ref)+'"/>';
  ser.forEach(function(p,i){if(p.v==null){if(cur.length)segs.push(cur);cur=[]}else cur.push([x(i),y(p.v)])});
  if(cur.length)segs.push(cur);
  var pts=segs.map(function(s){return s.length>1?'<polyline class="ln" stroke="'+o.color+'" points="'+s.map(function(p){return p[0].toFixed(1)+","+p[1].toFixed(1)}).join(" ")+'"/>':""}).join("");
  var dots=ser.map(function(p,i){return p.v==null?"":'<circle class="dot" cx="'+x(i).toFixed(1)+'" cy="'+y(p.v).toFixed(1)+'" r="4.5" fill="'+o.color+'"><title>'+fmt(p.d)+": "+p.v+'</title></circle>'}).join("");
  var xl="";for(i=0;i<n;i++){if(i%3===0||i===n-1)xl+='<text x="'+x(i).toFixed(1)+'" y="'+(H-6)+'" text-anchor="middle">'+fmt(ser[i].d)+'</text>'}
  var has=ser.some(function(p){return p.v!=null});
  return '<svg viewBox="0 0 '+W+" "+H+'" role="img" aria-label="'+esc(o.label)+'">'+g+pts+dots+xl+'</svg>'+(has?"":'<p class="muted small">Sem registros nos últimos 14 dias.</p>');
}
function chartsHtml(st){
  return '<div class="charts"><div class="card chart"><h3>Humor</h3><p class="muted small">Últimos 14 dias, de 1 (muito mal) a 5 (muito bem)</p>'+
    chart(series14(st,"humor"),{min:1,max:5,ticks:[1,2,3,4,5],color:"var(--brand)",label:"Gráfico de humor nos últimos 14 dias"})+'</div>'+
    '<div class="card chart"><h3>Fissura</h3><p class="muted small">Últimos 14 dias, de 0 a 10. A linha tracejada marca 8.</p>'+
    chart(series14(st,"fissura"),{min:0,max:10,ticks:[0,5,10],ref:8,color:"var(--warm)",label:"Gráfico de fissura nos últimos 14 dias"})+'</div></div>';
}

/* ---------- componentes ---------- */
var FACE=["M11 27 Q20 19 29 27","M11 26 Q20 22 29 26","M11 25 L29 25","M11 23 Q20 29 29 23","M10 22 Q20 33 30 22"];
function face(v){return '<svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="17"/><circle cx="14" cy="15" r="1.3" fill="currentColor"/><circle cx="26" cy="15" r="1.3" fill="currentColor"/><path d="'+FACE[v-1]+'"/></svg>'}
function faces(name,sel){
  return '<div class="faces" role="radiogroup">'+[1,2,3,4,5].map(function(v){
    return '<div><input type="radio" name="'+name+'" id="'+name+'-'+v+'" value="'+v+'"'+(sel===v?" checked":"")+' required><label for="'+name+'-'+v+'">'+face(v)+HUMOR[v-1]+'</label></div>'}).join("")+'</div>';
}
function pick(name,sel,vals,labels){
  return '<div class="pick" role="radiogroup">'+vals.map(function(v,i){
    return '<div><input type="radio" name="'+name+'" id="'+name+'-'+i+'" value="'+v+'"'+(String(sel)===String(v)?" checked":"")+' required><label for="'+name+'-'+i+'">'+esc(labels?labels[i]:v)+'</label></div>'}).join("")+'</div>';
}
var ICONS={
  home:'<path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
  check:'<circle cx="12" cy="12" r="9"/><path d="M8 12.5l3 3 5-6"/>',
  bolt:'<path d="M13 2L4 14h7l-1 8 9-12h-7z"/>',
  user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>',
  help:'<circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.7.4-1 .9-1 1.7M12 17h.01"/>',
  users:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.5 3-5.5 6.5-5.5S15.5 16.5 15.5 20"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 15c2 .6 3.5 2.2 3.5 5"/>',
  flag:'<path d="M5 21V4M5 4h11l-2 4 2 4H5"/>'
};
function sevPill(sev,st){
  var m={bad:["bad","Atenção"],warn:["warn","Observar"],ok:["ok","Estável"],n:["n","Sem registros"]};
  return '<span class="pill '+m[sev][0]+'">'+m[sev][1]+'</span>';
}
function toast(msg){var t=$("#toast");t.textContent=msg;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(function(){t.hidden=true},3200)}
function errMsg(e){return e&&e.code==="invalid_argument"?"Sem permissão para salvar. Peça acesso de Contribuidor ao dono do app.":"Não foi possível salvar agora. Tente de novo."}

/* ---------- gravação ---------- */
var chain=Promise.resolve();
function canSave(){
  if(S.sample){toast("Modo exemplo: nada é salvo.");return false}
  if(!S.db||!S.uid){toast("Entre na sua conta do Claude para salvar.");return false}
  return true;
}
function saveMe(patch){
  if(!canSave())return Promise.resolve(false);
  var base=Object.assign({},S.me||{},patch);
  S.me=base;
  chain=chain.then(function(){return S.db.doc("alunos/"+S.uid).set(base)}).then(function(){return true},function(e){toast(errMsg(e));return false});
  return chain;
}

  var ord={bad:0,warn:1,ok:2,n:3};

/* ---------- estrutura ---------- */
function tabs(){
  return S.role==="pro"?[["alunos","Alunos","users"],["turmas","Turmas","flag"],["ajuda","Ajuda","help"]]
    :[["inicio","Início","home"],["checkin","Check-in","check"],["atividade","Atividade","bolt"],["cadastro","Cadastro","user"],["ajuda","Ajuda","help"]];
}
function renderChrome(){
  var tl='';
  if(S.role)tl+='<button class="btn sm" data-act="perfil">'+(S.role==="pro"?"Professor":"Aluno")+' · Trocar perfil</button>';
  tl+='<button class="btn sm" data-act="sample" aria-pressed="'+S.sample+'">'+(S.sample?"Sair dos exemplos":"Ver com exemplos")+'</button>';
  $("#tools").innerHTML=tl;
  var b='';
  if(S.sample)b+='<div class="banner">Modo exemplo: os dados abaixo são fictícios e nada é salvo.</div>';
  if(S.ready&&!S.db&&!S.sample)b+='<div class="banner bad">Não foi possível conectar ao banco de dados. Entre na sua conta do Claude para salvar registros, ou veja o app com exemplos.</div>';
  if(S.slow&&!S.meLoaded&&S.db&&!S.sample)b+='<div class="banner">Os dados estão demorando para chegar. Verifique sua conexão.</div>';
  if(S.db&&!S.sample&&S.role==="aluno"&&S.canWrite===false)b+='<div class="banner bad">Seu acesso é só de leitura. Peça ao dono do app acesso de Contribuidor para registrar.</div>';
  if(S.role==="pro"&&S.ready&&S.db&&!S.sample&&!S.canEdit)b+='<div class="banner bad">Seu acesso não permite ver os registros dos alunos. Peça ao dono do app acesso de Editor.</div>';
  $("#nav").hidden=!S.role;
  $("#banners").innerHTML=b;
  $("#navin").innerHTML=tabs().map(function(t){return '<button data-act="go" data-tab="'+t[0]+'"'+(S.tab===t[0]?' aria-current="page"':"")+'><svg viewBox="0 0 24 24" aria-hidden="true">'+ICONS[t[2]]+'</svg>'+t[1]+'</button>'}).join("");
}
function render(force){
  var ae=document.activeElement;
  if(!force&&ae&&/^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName)&&$("#view").contains(ae)){S.pending=true;return}
  S.pending=false;
  renderChrome();
  var v=$("#view");
  if(!S.role){var lk="L"+S.sample;if(v.dataset.k!==lk){v.innerHTML=vLanding();v.dataset.k=lk}return}
  v.dataset.k="";
  if(!S.ready){v.innerHTML='<div class="card"><p class="muted">Carregando…</p></div>';return}
  var map={inicio:vInicio,checkin:vCheckin,atividade:vAtividade,cadastro:vCadastro,alunos:vAlunos,turmas:vTurmas,ajuda:vAjuda};
  if(!map[S.tab])S.tab=S.role==="pro"?"alunos":"inicio";
  if(S.db&&!S.sample&&S.role==="aluno"&&!S.meLoaded&&S.tab!=="ajuda"){v.innerHTML='<div class="card"><p class="muted">Carregando seus dados…</p></div>';return}
  v.innerHTML=map[S.tab]();
}
function go(tab){S.tab=tab;S.sel=null;S.confirmDel=null;render(true);window.scrollTo(0,0)}

/* ---------- ações ---------- */
function exportCsv(){
  var rows=[["aluno","turma","data","humor","fissura","usou","praticou_atividade","observacoes"]];
  curAlunos().filter(function(a){return !S.filtro||a.turmaId===S.filtro}).forEach(function(a){
    stats(a).ck.forEach(function(c){rows.push([a.nome,turmaNome(a.turmaId),c.d,c.humor,c.fissura,c.usou?"sim":"nao",c.praticou?"sim":"nao",c.obs||""])})});
  var csv="﻿"+rows.map(function(r){return r.map(function(x){x=String(x==null?"":x);return /[",\n;]/.test(x)?'"'+x.replace(/"/g,'""')+'"':x}).join(",")}).join("\n");
  if(!S.dl){toast("Exportar não está disponível aqui.");return}
  S.dl.save({filename:"scrum-registros-"+today()+".csv",data:new Blob([csv],{type:"text/csv"})}).then(function(){toast("Arquivo salvo.")},function(e){if(!e||e.code!=="declined")toast("Não foi possível exportar.")});
}
document.addEventListener("click",function(e){
  var b=e.target.closest("[data-act]");if(!b)return;
  var act=b.dataset.act,d=b.dataset;
  if(act==="go")go(d.tab);
  else if(act==="perfil-set"){S.role=d.r;store("scrum-perfil",d.r);S.tab=d.r==="pro"?"alunos":"inicio";S.sel=null;S.confirmDel=null;render(true);window.scrollTo(0,0)}
  else if(act==="perfil"){S.role=null;store("scrum-perfil","");S.sel=null;S.confirmDel=null;render(true);window.scrollTo(0,0)}
  else if(act==="sample"){S.sample=!S.sample;if(S.sample&&S.role==="aluno")S.tab="inicio";S.sel=null;render(true)}
  else if(act==="open"){S.sel=d.id;render(true);window.scrollTo(0,0)}
  else if(act==="back"){S.sel=null;render(true)}
  else if(act==="csv")exportCsv();
  else if(act==="del"){S.confirmDel="me";render(true)}
  else if(act==="del-no"){S.confirmDel=null;render(true)}
  else if(act==="del-ok"){
    if(!canSave())return;
    S.db.doc("alunos/"+S.uid).delete().then(function(){S.me=null;S.confirmDel=null;toast("Seus dados foram excluídos.");render(true)},function(er){toast(errMsg(er))});
  }
  else if(act==="tdel"){S.confirmDel="t"+d.id;render(true)}
  else if(act==="tdel-ok"){
    if(!canSave())return;
    (S.canEdit?S.db.doc("turmas/"+d.id).delete():Promise.reject({code:"invalid_argument"})).then(function(){S.confirmDel=null;toast("Turma excluída.")},function(er){toast(errMsg(er))});
  }
});
document.addEventListener("change",function(e){
  if(e.target.id==="filtro"){S.filtro=e.target.value;render(true)}
  if(e.target.id==="esporte"){$("#outro-box").hidden=e.target.value!=="Outro"}
});
document.addEventListener("input",function(e){if(e.target.id==="fissura")$("#fissura-out").textContent=e.target.value});
document.addEventListener("focusout",function(){setTimeout(function(){if(S.pending)render(false)},150)});
document.addEventListener("submit",function(e){
  e.preventDefault();
  var f=e.target,fd=new FormData(f),id=f.id;
  if(id==="f-checkin"){
    var t=today(),a=curMe()||{};
    var ck=(a.checkins||[]).filter(function(c){return c.d!==t});
    var usou=fd.get("usou")==="sim";
    ck.push({d:t,humor:+fd.get("humor"),fissura:+fd.get("fissura"),usou:usou,praticou:fd.get("praticou")==="sim",obs:String(fd.get("obs")||"").trim()});
    ck.sort(function(x,y){return x.d<y.d?-1:1});
    saveMe({checkins:ck.slice(-400)}).then(function(ok){if(ok){S.acolhe=usou;toast("Check-in salvo.");go("inicio")}});
  }else if(id==="f-ativ"){
    var a2=curMe()||{},esp=fd.get("esporte")==="Outro"?(String(fd.get("outro")||"").trim()||"Outro"):fd.get("esporte");
    var at=(a2.atividades||[]).slice();
    at.push({id:"a"+Date.now(),d:today(),esporte:esp,min:+fd.get("min"),sentiu:+fd.get("sentiu"),aprov:+fd.get("aprov"),obs:String(fd.get("aobs")||"").trim()});
    saveMe({atividades:at.slice(-400)}).then(function(ok){if(ok){S.acolhe=false;toast("Atividade salva.");go("inicio")}});
  }else if(id==="f-cad"){
    saveMe({nome:String(fd.get("nome")).trim(),nascimento:fd.get("nascimento")||"",contato:fd.get("contato")||"",turmaId:fd.get("turmaId")||"",
      historico:fd.get("historico")||"",objetivos:fd.get("objetivos")||"",esportes:fd.getAll("esportes"),apoioNome:fd.get("apoioNome")||"",apoioTel:fd.get("apoioTel")||"",
      consentimento:true,checkins:(S.me&&S.me.checkins)||[],atividades:(S.me&&S.me.atividades)||[]}).then(function(ok){if(ok){toast("Cadastro salvo.");go("inicio")}});
  }else if(id==="f-turma"){
    if(!canSave())return;
    if(!S.canEdit){toast("Só professores com acesso de Editor criam turmas.");return}
    S.db.collection("turmas").add({nome:String(fd.get("nome")).trim(),publico:fd.get("publico")}).then(function(){toast("Turma criada.");f.reset()},function(er){toast(errMsg(er))});
  }
});

/* ---------- inicialização ---------- */
var use=(window.claude&&window.claude.use)?window.claude.use.bind(window.claude):function(){return Promise.resolve(null)};
var sp=$("#splash"),spDone=false,reduce=window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches;
(function(){var h="",i;for(i=0;i<46;i++){var y=(6.5+7.6*i).toFixed(1);h+='<line x1="0" x2="315" y1="'+y+'" y2="'+y+'" style="animation-delay:'+(i*0.018).toFixed(2)+'s"/>'}$("#sp-st").innerHTML=h})();
function endSplash(){if(spDone)return;spDone=true;sp.classList.add("out");document.body.classList.add("go");setTimeout(function(){sp.remove()},500)}
sp.addEventListener("click",endSplash);
setTimeout(endSplash,reduce?700:2800);
render(true);
setTimeout(function(){S.slow=true;if(!S.meLoaded)render(false)},10000);
Promise.all([use("db"),use("user"),use("downloads")]).then(function(r){
  S.db=r[0];S.dl=r[2];var user=r[1];
  var p=user?Promise.all([user.id(),user.canEdit(),user.can("data.write")]):Promise.resolve([null,false,null]);
  return p;
}).then(function(u){
  S.uid=u[0];S.canEdit=!!u[1];S.canWrite=u[2];
  S.ready=true;
  if(S.db){
    S.db.collection("turmas").onSnapshot(function(s){S.turmas=s.docs.map(function(d){return Object.assign({id:d.id},d.data())}).sort(function(a,b){return String(a.nome).localeCompare(String(b.nome),"pt")});render(false)},function(){});
    if(S.uid)S.db.doc("alunos/"+S.uid).onSnapshot(function(s){S.me=s.exists?s.data():null;S.meLoaded=true;render(false)},function(){S.meLoaded=true;render(false)});
    else S.meLoaded=true;
    if(S.canEdit)S.db.collection("alunos").onSnapshot(function(s){S.alunos=s.docs.map(function(d){return Object.assign({id:d.id},d.data())});S.alunosLoaded=true;render(false)},function(){S.alunosLoaded=true;render(false)});
  }
  render(true);
});
})();
</script>

</body></html>
